# gitlab setting
gitlab_package_name: "gitlab-ce-16.10.6*"
gitlab_address: "<change-me>" # changed the ip address or domain of your gitlab
gitlab_proto: http # default protocol is `http`, you can changed this to `https`
gitlab_init_root_password: '<change-me>' # changed the default password of user root on gitlab account
gitlab_init_shared_runner_registration_token: '<change-me>' # changed the default token to gitlab runner
gitlab_external_url: "{{ gitlab_proto }}://{{ gitlab_address }}"
# gitlab-runner
gitlab_url: "{{ gitlab_proto }}://{{ gitlab_address }}"
gitlab_register_token: "{{ gitlab_init_shared_runner_registration_token }}"
docker_insecure_registries_enabled: true
registry_address: "<change-me>" # changed the ip address of your private
registry_domain: private.nexus-registry.docker.local
registry_username: '<change-me>' # changed the user name of your nexus username cred
registry_password: '<change-me>' # change the password of your nexus password cred
docker_insecure_registries_conf:
  - url: "{{registry_domain}}:8086"
    auth:
      docker_login: true
      user: "{{ registry_username }}"
      password: "{{ registry_password }}"
  - url: "{{registry_domain}}:8087"
    auth:
      docker_login: true
      user: "{{ registry_username }}"
      password: "{{ registry_password }}"
gitlab_runner_extra_host: 
  - '{{ registry_domain }}:{{ registry_address }}'
gitlab_runner_docker_volumes: 
  - '/var/run/docker.sock:/var/run/docker.sock'
  - '/certs/client'
  - '/certs/ca'
  - '/cache'
## nexus oss
nexus_admin_user: 'admin'
nexus_admin_password: '<change-me>' # changed this username of your password of user admin
nexus_create_new_user: true # set true if you want create an other user
nexus_new_user: "{{ registry_username }}"
nexus_new_user_pass: "{{ registry_password }}"
## gitlab-post-install
enabled_gitlab_config_variables_instance: true
enabled_gitlab_import_sources: true
enabled_update_gitlab_runners: true
docker_registry_login_secret: "{{ registry_username }}:{{ registry_password }}"
gitlab_private_access_token: "<changed-me>" # generate the access token from gitlab on personal access token, see tutorial below
sonarqube_host: "<change-me>" # changed the ip address or domain of your sonarqube
sonarqube_port: 9000
sonarqube_auth_token: "<changed-me>" # generate the access token from sonarqube on System -> access token, see tutorial below
maven_default_host: "{{ registry_address }}"
maven_default_port: 8081
maven_default_username: "{{ nexus_admin_user }}"
maven_default_password: "{{ nexus_admin_password }}"
## opensearch
opensearch_version: 2.15.0
default_admin_password: "Admin/4u@2024"
opensearch_cluster_name: "logging_system"
opensearch_cluster_enabled: false # set to true if you want cluster mode
opensearch_discovery_seed_hosts: [""] # set this split by comma if you have multiple nodes for ex: []"10.12.10.21", "10.12.10.22"]
opensearch_cluster_initial_cluster_manager_nodes: [""] # set this split by comma if you have multiple nodes for ex: ["10.12.10.20"]